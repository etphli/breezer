name: Breezer source and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breezer-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  upstream-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/advertising/
            !/site/videos/
            !/docs/evidence/*
            /docs/evidence/memory-20261102/native-transport-final-*.json
      - uses: actions/setup-python@v6
        with:
          python-version-file: upstream/helium-macos/helium-chromium/.python-version
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Verify complete upstream import
        run: python script/verify_upstream.py
      - name: Check build script syntax
        run: |
          bash -n script/build_and_run.sh
          bash -n features/ai/host/launch.sh
          python -m py_compile script/apply_breezer_branding.py script/check_branding.py script/apply_breezer_ai.py script/package_breezer_ai.py
      - name: Verify isolated build profiles
        run: python script/check_breezer_build_profile.py
      - name: Verify opt-in saved-frame preparation
        run: python -B script/check_breezer_frame_budget.py --fixture-source tests/fixtures/frame-budget/base --work-dir build/frame-budget-fixture-check
      - name: Verify hidden native scrollbar scheduling
        run: |
          python -B script/check_breezer_hidden_scrollbar.py --failure-controls
          python -B script/check_breezer_hidden_scrollbar_prestart.py
      - name: Verify AI packaging boundaries
        run: |
          python script/check_ai_packaging.py
          python tests/ai/overlay_test.py
          python -B tests/ai_resources_test.py
          python script/check_breezer_installer.py
          python script/check_breezer_preparation.py
      - name: Test AI browser controls and CLI protocol
        run: node --test tests/*.test.mjs tests/ai/*.test.mjs
      - name: Verify filter source overlays
        run: |
          python -B tests/filter-source-overlays/fixtures/main-port-20261115/prepare.py --check
          python -B tests/filter_source_overlays_test.py
          node --test tests/filter-source-overlays/tokens-contract.test.mjs tests/filter-source-overlays/toolbar-behavior.test.mjs tests/filter-source-overlays/toolbar-reduction.test.mjs tests/filter-source-overlays/cache-keys.test.mjs tests/filter-source-overlays/css-parser.test.mjs
          node tests/filter-source-overlays/headers.test.mjs
      - name: Verify native AI source integration
        run: python script/check_ai_overlay.py
      - name: Install upstream test dependencies
        run: python -m pip install -r upstream/helium-macos/helium-chromium/.requirements.txt
      - name: Verify shared release identity
        run: python script/check_breezer_release.py
      - name: Verify Windows packaging and password import contracts
        run: |
          python tests/windows/build_breezer_test.py
          python tests/windows/ai_native_host_test.py
          python tests/windows_import_test.py
      - name: Verify omnibox source overlay
        run: python script/check_breezer_omnibox.py
      - name: Verify workspace and full-height assistant overlays
        run: |
          python script/check_breezer_workspace.py
          python script/check_breezer_sync.py
          python script/check_breezer_sidebar_frame.py
          python script/check_breezer_ai_ui.py
          python script/check_breezer_passwords.py
          python tests/passwords_native_test.py
      - name: Run all imported tests and configuration checks
        run: python script/check_helium.py

  browser-tests:
    name: Browser tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [interface, translation-and-website]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/evidence/
            ${{ matrix.suite == 'interface' && '!/advertising/' || '' }}
            ${{ matrix.suite == 'interface' && '!/site/videos/' || '' }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Install browser verification dependencies
        working-directory: tests/ai
        env:
          BROWSER_INSTALL_OPTION: ${{ matrix.suite == 'interface' && '--only-shell' || '' }}
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium ${BROWSER_INSTALL_OPTION:+"$BROWSER_INSTALL_OPTION"}
          if ! node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          await (await chromium.launch()).close();
          if (!process.env.BROWSER_INSTALL_OPTION) {
            await (await chromium.launch({ channel: 'chromium' })).close();
          }
          JS
          then
            npx playwright install-deps chromium
          fi
      - name: Verify sidebar and visible browser control
        if: matrix.suite == 'interface'
        env:
          BREEZER_AI_EVIDENCE: ${{ runner.temp }}/breezer-ai-evidence
        run: |
          node tests/ai/panel-browser.mjs
          node --test tests/ai/browser-theme-browser.test.mjs tests/ai/clipboard-image-browser.test.mjs
          node tests/ai/research-browser.mjs
          node --test tests/ai/workspace-browser.test.mjs tests/ai/workspace-folder-colors-browser.test.mjs tests/ai/workspace-chrome.test.mjs
          node --test --test-concurrency=2 tests/ai/ui-polish-browser.test.mjs tests/ai/settings-redesign-browser.test.mjs tests/ai/newtab-browser.test.mjs tests/ai/experiments-browser.test.mjs tests/ai/workspace-frame.test.mjs
          node --test tests/ai/windows-component.test.mjs
          node --test tests/sync/setup-browser.test.mjs
          node tests/ai/browser-page.mjs
          node tests/ai/docs-editor-browser.mjs
      - name: Verify passkey component and virtual WebAuthn protocol
        if: matrix.suite == 'interface'
        env:
          BREEZER_PASSKEY_EVIDENCE: ${{ runner.temp }}/breezer-passkey-evidence
        run: |
          node tests/passkeys/component.mjs
          node tests/passkeys/virtual.mjs
      - name: Verify login Enter stock-browser baseline (not native Breezer acceptance)
        if: matrix.suite == 'interface'
        run: node tests/passwords/enter-browser.mjs --baseline
      - name: Verify page translation, website, usage calculations, and dashboard access boundaries
        if: matrix.suite == 'translation-and-website'
        env:
          BREEZER_AI_EVIDENCE: ${{ runner.temp }}/breezer-ai-evidence
          BREEZER_SITE_EVIDENCE: ${{ runner.temp }}/breezer-site-evidence
        run: |
          # Run the website checks while the translation test waits for Chromium's idle deadline.
          node --test tests/ai/translation.test.mjs tests/ai/translation-browser.test.mjs &
          translation_pid=$!
          website_status=0
          (npm ci --ignore-scripts --prefix site && npm test --prefix site) || website_status=$?
          wait "$translation_pid"
          exit "$website_status"
      - name: Upload website verification screenshots
        if: ${{ !cancelled() && matrix.suite == 'translation-and-website' }}
        uses: actions/upload-artifact@v4
        with:
          name: breezer-website-verification
          path: ${{ runner.temp }}/breezer-site-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload AI verification screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: breezer-ai-ui-verification-${{ matrix.suite }}
          path: ${{ runner.temp }}/breezer-ai-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload passkey fixture evidence
        if: ${{ !cancelled() && matrix.suite == 'interface' }}
        uses: actions/upload-artifact@v4
        with:
          name: breezer-passkey-fixtures-not-native-acceptance
          path: ${{ runner.temp }}/breezer-passkey-evidence/
          if-no-files-found: ignore
          retention-days: 7
