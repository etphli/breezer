<!doctype html>
<html lang="en" data-tone="mint" data-scheme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <a class="settings-link" href="workspace.html#/settings" aria-label="Breezer settings" title="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h6M12 4.5h1M3 11.5h1M7 11.5h6"/><circle cx="10.5" cy="4.5" r="1.6"/><circle cx="5.5" cy="11.5" r="1.6"/></svg><span>Settings</span></a>

  <header class="sky">
    <h1 id="today" class="today">New tab</h1>
    <section id="composer" class="composer" aria-label="Search or ask" hidden>
      <section id="recent-chats" class="recent-chats" aria-labelledby="recent-chats-title" hidden>
        <h2 id="recent-chats-title" class="recent-chats-title">Recent chats</h2>
        <ol id="recent-chats-list" class="recent-chats-list"></ol>
      </section>
      <form id="composer-form" class="composer-box" data-mode="search" novalidate>
        <textarea id="composer-input" class="composer-input" rows="1" autocomplete="off" spellcheck="false" placeholder="Search the web or type an address" aria-label="Search the web or type an address" aria-describedby="composer-status"></textarea>
        <div class="composer-bar">
          <div id="composer-modes" class="composer-modes" role="radiogroup" aria-label="When you press Enter">
            <span class="composer-thumb" aria-hidden="true"></span>
            <button type="button" role="radio" data-mode="search" aria-checked="true">Search</button>
            <button type="button" role="radio" data-mode="ask" aria-checked="false">Ask Breezer</button>
          </div>
          <a id="composer-style" class="composer-style" href="workspace.html#/settings/experiments" hidden></a>
          <button id="composer-send" class="composer-send" type="submit" aria-label="Search">
            <svg class="send-search" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="m10.2 10.2 3.3 3.3"/></svg>
            <svg class="send-ask" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M4 7.5l4-4 4 4"/></svg>
          </button>
        </div>
      </form>
      <p id="composer-status" class="composer-status" role="status" aria-live="polite"></p>
      <ul id="composer-sites" class="composer-sites" aria-label="Frequent sites" hidden></ul>
    </section>
    <nav class="sites-nav" aria-label="Frequently visited sites">
      <ol id="sites" class="sites" aria-busy="true"></ol>
      <p id="sites-empty" class="sites-empty" hidden>Sites you visit often will appear here.</p>
      <div class="shortcut-feedback"><span id="shortcut-status" role="status" aria-live="polite"></span><button id="shortcut-undo" type="button" hidden>Undo</button><button id="sites-reset" type="button" hidden>Restore shortcuts</button></div>
      <form id="shortcut-add" class="shortcut-add" popover="auto" role="dialog" aria-labelledby="shortcut-add-title" novalidate>
        <h2 id="shortcut-add-title">Add shortcut</h2>
        <input id="shortcut-add-input" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Type a URL or find an open tab" aria-label="Website address or open tab" role="combobox" aria-expanded="true" aria-autocomplete="list" aria-controls="shortcut-add-tabs" aria-describedby="shortcut-add-error">
        <p id="shortcut-add-error" role="status" hidden></p>
        <p class="shortcut-add-group" id="shortcut-add-tabs-label">Open tabs</p>
        <ul id="shortcut-add-tabs" role="listbox" aria-labelledby="shortcut-add-tabs-label"></ul>
        <div class="shortcut-add-actions">
          <button type="button" popovertarget="shortcut-add" popovertargetaction="hide">Cancel</button>
          <button type="submit" disabled>Add</button>
        </div>
      </form>
    </nav>
  </header>

  <main class="sheet">
    <section id="organato" class="organato" data-state="loading" aria-labelledby="organato-title" aria-busy="true">
      <div class="organato-head">
        <h2 id="organato-title" class="organato-title">Coming up in Organato</h2>
        <div class="agenda-actions">
          <a class="organato-open" href="https://organato.vercel.app" rel="noreferrer">Open Organato</a>
          <button id="refresh" class="refresh" type="button" hidden title="Refresh sites and Organato"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13 2.5v3h-3"/></svg><span>Refresh</span></button>
        </div>
      </div>

      <p id="organato-status" class="organato-status" role="status" aria-live="polite">Loading your exams, assignments and to-dos…</p>
      <p id="organato-action" class="organato-action" hidden></p>

      <div class="lanes agenda-skeleton" aria-hidden="true">
        <div class="skeleton-lane"><i></i><span></span><span></span><span></span></div>
        <div class="skeleton-lane"><i></i><span></span><span></span><span></span></div>
      </div>

      <div id="organato-lists" class="lanes" hidden>
        <div class="agenda-switch" role="group" aria-label="Agenda view">
          <button type="button" data-lane="upcoming" aria-pressed="true" aria-controls="upcoming-lane">Upcoming <span class="lane-count"></span></button>
          <button type="button" data-lane="todos" aria-pressed="false" aria-controls="todos-lane">To-dos <span class="lane-count"></span></button>
        </div>
        <section id="upcoming-lane" class="lane lane-upcoming" aria-labelledby="lane-upcoming">
          <h3 id="lane-upcoming" class="lane-title">Upcoming <span class="lane-count" data-count="upcoming"></span></h3>
          <ol class="items" data-list="upcoming"></ol>
        </section>
        <section id="todos-lane" class="lane lane-todos" aria-labelledby="lane-todos">
          <h3 id="lane-todos" class="lane-title" tabindex="-1">To-dos <span class="lane-count" data-count="todos"></span></h3>
          <ol class="items" data-list="todos"></ol>
        </section>
      </div>
    </section>
  </main>

  <script type="module" src="newtab.js"></script>
</body>
</html>
